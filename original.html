<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location-Based AR · Original article example</title>
  <script src="vendor/aframe-0.9.2.min.js"></script>
  <script src="vendor/aframe-ar-2.0.8.js"></script>
  <script src="vendor/aframe-extras.loaders-5.0.0.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false"
    arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false; cameraParametersUrl: assets/camera_para.dat;">
    <a-entity gltf-model="./assets/magnemite/scene.gltf" rotation="0 180 0"
      scale="0.15 0.15 0.15" gps-entity-place="longitude: 12.489820; latitude: 41.892590;"
      animation-mixer></a-entity>
    <a-camera gps-camera rotation-reader></a-camera>
  </a-scene>
</body>
</html>

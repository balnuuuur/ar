<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2-тапсырма · Location-Based AR</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0 !important; width: 100vw !important; height: 100vh !important; overflow: hidden; }
    a-scene { position: fixed !important; inset: 0; width: 100% !important; height: 100% !important; }
    a-scene canvas { width: 100% !important; height: 100% !important; left: 0 !important; top: 0 !important; margin: 0 !important; }
    #arjs-video { position: fixed !important; width: 100vw !important; height: 100vh !important; object-fit: cover; left: 0 !important; top: 0 !important; margin: 0 !important; }
    .a-enter-vr, .a-enter-ar, .a-loader-title, .a-loading-screen,
    .arjs-loader, #arjsDebugUIContainer, #alert-popup { display: none !important; }
  </style>
  <script src="vendor/aframe-0.9.2.min.js"></script>
  <script src="vendor/aframe-ar-2.0.8.js"></script>
  <script src="vendor/aframe-extras.loaders-5.0.0.min.js"></script>
  <script src="location.js?v=2"></script>
</head>
<body>
  <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false"
    renderer="alpha: true; antialias: true"
    arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false; cameraParametersUrl: assets/camera_para.dat;">
    <a-entity id="magnemite" visible="false" gltf-model="./assets/magnemite/scene.gltf"
      rotation="0 180 0" scale="0.15 0.15 0.15" animation-mixer
      gps-entity-place="latitude: 41.892590; longitude: 12.489820;"></a-entity>
    <a-camera gps-camera="alert: false" rotation-reader>
      <a-entity id="preview" position="0 -1.2 -8" rotation="0 180 0"
        scale="0.15 0.15 0.15" gltf-model="./assets/magnemite/scene.gltf" animation-mixer></a-entity>
    </a-camera>
  </a-scene>
</body>
</html>
